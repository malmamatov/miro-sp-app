<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>SP Sum — entry</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
</head>
<body>
  <script>
    // Точка входа приложения.
    // При клике по иконке приложения на панели инструментов Miro —
    // открывает боковую панель panel.html, где происходит вся работа.
    miro.board.ui.on('icon:click', async () => {
      await miro.board.ui.openPanel({ url: 'panel.html' });
    });
  </script>
</body>
</html>
